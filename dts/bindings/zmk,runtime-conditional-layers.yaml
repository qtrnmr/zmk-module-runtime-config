description: Runtime-editable conditional layers (verbatim fork of zmk,conditional-layers)

compatible: "zmk,runtime-conditional-layers"

child-binding:
  description: "Single conditional layer that activates then-layer when if-layers are active"

  properties:
    if-layers:
      type: array
      required: true
    then-layer:
      type: int
      required: true
